[project]
name = "eleicoes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "calilisantos", email = "calilisantos@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
